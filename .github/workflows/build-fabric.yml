name: Build Fabric

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: actions/setup-java@v4.2.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build Fabric
        run: ./gradlew --no-daemon buildFabric
      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4.3.3
        with:
          name: linearreader-fabric
          path: fabric/build/libs/*-fabric.jar
          if-no-files-found: error
