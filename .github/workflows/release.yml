name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: fabric
            task: buildFabric
            artifact_name: linearreader-fabric
            artifact_path: fabric/build/libs/*-fabric.jar
          - id: forge
            task: buildForge
            artifact_name: linearreader-forge
            artifact_path: forge-neoforge/build/libs/*-forge.jar
          - id: neoforge
            task: buildNeoForge
            artifact_name: linearreader-neoforge
            artifact_path: forge-neoforge/build/libs/*-neoforge.jar
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: actions/setup-java@v4.2.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build ${{ matrix.id }}
        run: ./gradlew --no-daemon ${{ matrix.task }}
      - name: Upload ${{ matrix.id }} jar
        uses: actions/upload-artifact@v4.3.3
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          path: release-artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2.0.8
        with:
          files: |
            release-artifacts/linearreader-fabric/*.jar
            release-artifacts/linearreader-forge/*.jar
            release-artifacts/linearreader-neoforge/*.jar
          generate_release_notes: true
