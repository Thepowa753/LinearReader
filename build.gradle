import org.gradle.internal.os.OperatingSystem

plugins {
    id 'base'
}

def wrapperCommand = { String taskName, List<String> extraArgs ->
    if (OperatingSystem.current().isWindows()) {
        return ['cmd', '/c', 'gradlew.bat', taskName] + extraArgs
    }
    return ['./gradlew', taskName] + extraArgs
}

def registerChildTask = { String name, String childDir, String childTask, List<String> extraArgs = [] ->
    tasks.register(name, Exec) {
        group = 'linearreader'
        description = "Runs ${childTask} in ${childDir}."
        workingDir = file(childDir)
        commandLine(wrapperCommand(childTask, extraArgs))
    }
}

registerChildTask('compileFabric', 'fabric', 'compileJava')
registerChildTask('compileForge', 'forge-neoforge', 'compileJava', ['-PtargetLoader=forge'])
registerChildTask('compileNeoForge', 'forge-neoforge', 'compileJava', ['-PtargetLoader=neoforge'])
registerChildTask('buildFabric', 'fabric', 'build')
registerChildTask('buildForge', 'forge-neoforge', 'build', ['-PtargetLoader=forge'])
registerChildTask('buildNeoForge', 'forge-neoforge', 'build', ['-PtargetLoader=neoforge'])
registerChildTask('cleanFabric', 'fabric', 'clean')
registerChildTask('cleanForgeNeoForge', 'forge-neoforge', 'clean')
registerChildTask('testFabric', 'fabric', 'test')
registerChildTask('testForge', 'forge-neoforge', 'test', ['-PtargetLoader=forge'])
registerChildTask('testNeoForge', 'forge-neoforge', 'test', ['-PtargetLoader=neoforge'])
registerChildTask('generateTestCorpus', 'fabric', 'generateTestCorpus')

tasks.register('compileAll') {
    group = 'linearreader'
    description = 'Compiles all loader targets.'
    dependsOn 'compileFabric', 'compileForge', 'compileNeoForge'
}

tasks.register('buildAll') {
    group = 'linearreader'
    description = 'Builds all loader targets.'
    dependsOn 'buildFabric', 'buildForge', 'buildNeoForge'
}

tasks.register('testAll') {
    group = 'linearreader'
    description = 'Runs the shared storage test suite in all loader environments.'
    dependsOn 'testFabric', 'testForge', 'testNeoForge'
}

tasks.register('cleanAll') {
    group = 'linearreader'
    description = 'Cleans both loader targets.'
    dependsOn 'cleanFabric', 'cleanForgeNeoForge'
}

tasks.named('check').configure {
    dependsOn 'testFabric', 'testForge', 'testNeoForge'
}

tasks.register('collectJars', Copy) {
    group = 'linearreader'
    description = 'Collects built mod jars from all loader targets into root/build/collected-jars.'
    dependsOn 'buildAll'
    into layout.buildDirectory.dir('collected-jars')

    from('fabric/build/libs') {
        include '*.jar'
        exclude '*-sources.jar', '*-javadoc.jar'
        into 'fabric'
    }

    from('forge-neoforge/build/libs') {
        include '*-forge.jar'
        exclude '*-sources.jar', '*-javadoc.jar'
        into 'forge'
    }

    from('forge-neoforge/build/libs') {
        include '*-neoforge.jar'
        exclude '*-sources.jar', '*-javadoc.jar'
        into 'neoforge'
    }
}
